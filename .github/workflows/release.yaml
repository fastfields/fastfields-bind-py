# Build & publish the fastfields-dlpack wheels. This is the only per-backend
# package: it bundles the compiled libfastfields*, so its wheels carry a
# platform tag and a `+<backend>` PEP 440 local version label (PyTorch
# convention) that the wheel index buckets on. The pure-Python wrappers ship a
# single universal wheel from the same reusable workflow with compiled: false.
#
# Release-driven: publish a GitHub Release here (creating the tag, e.g.
# `0.0.0.dev1`, and writing the notes) and this workflow builds the wheels at
# that tag, uploads them back onto that same release, and pings fastfields/whl
# to regenerate the wheel index. Nothing to run by hand.
#
# All the logic lives in the org-level reusable workflow so the five package
# repos stay identical; see fastfields/.github for the full contract.
#
# STATUS -- what this does NOT do yet:
#   * Only the `cpu` backend is built. The `cuXXX` lanes need the CUDA build of
#     fastfields-lib (FF_WITH_CUDA: the lib linking libfastfields-cuda, and
#     setup.py bundling it), which is MIGRATION.md task T21. The wheel index
#     already advertises those folders as "planned -- not yet published".
#   * Linux only. The C++ build uses clang-style Unix Makefiles that are not
#     Windows-portable (fastfields-dlpack#8), and the macOS leg needs
#     cross-arch work before an arm64 wheel can be trusted -- plain `make`
#     ignores cibuildwheel's target arch, so a macOS matrix entry would happily
#     emit a mislabelled wheel. Widen `runners` once those are addressed.

name: Release

on:
  release:
    types: [published]
  # Retry a failed publish against an already-published release, without
  # having to delete and re-cut it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload to"
        type: string
        required: true
      backend:
        description: "Compute backend (local version label)"
        type: choice
        default: cpu
        options: [cpu]

permissions:
  contents: write

jobs:
  release:
    uses: fastfields/.github/.github/workflows/python-release.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      compiled: true
      backend: ${{ inputs.backend || 'cpu' }}
      runners: '["ubuntu-latest"]'
    secrets: inherit
