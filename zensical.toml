[project]
site_name = "fastfields-bind-py"
site_description = "nanobind bindings from DLPack to the fastfields-lib C++ library (fastfields.dlpack)"
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/fastfields-bind-py/"
repo_url = "https://github.com/fastfields/fastfields-bind-py"
repo_name = "fastfields/fastfields-bind-py"
copyright = "Copyright &copy; 2026 The fastfields authors"
nav = [
  {"fastfields home" = "https://fastfields.github.io/"},
  {"Home" = "index.md"},
  {"API" = "api/index.md"},
]
[project.theme]
language = "en"
features = ["content.code.copy", "content.code.select", "navigation.indexes"]
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[project.theme.icon]
logo = "material/waves"
repo = "fontawesome/brands/github"
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
]
paths = ["."]
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
merge_init_into_class = true
separate_signature = true
members_order = "source"
show_root_heading = true
show_if_no_docstring = false
filters = "public"
show_signature_annotations = true
signature_crossrefs = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.toc]
toc_depth = 3
