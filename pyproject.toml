[build-system]
requires = ["setuptools>=64", "wheel", "nanobind>=1.9", "numpy", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields-dlpack"
description = "nanobind bindings from DLPack to the fastfields-lib C++ library (fastfields.dlpack)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
maintainers = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
keywords = ["fastfields", "medical-imaging", "interpolation", "distance-transform", "gpu", "dlpack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # `packaging` parses __version__ to expose the compute backend as
    # `fastfields.dlpack.backend` (see fastfields/dlpack/__init__.py).
    "packaging",
]

[project.optional-dependencies]
test = ["numpy", "pytest"]

# Explicit single-package listing: only the ``fastfields.dlpack`` subpackage is
# shipped. Crucially, no ``fastfields/__init__.py`` is created or packaged, so
# ``fastfields`` stays a PEP 420 native namespace package that other
# distributions (fastfields-numpy, fastfields-torch, fastfields-cupy,
# fastfields) can merge into.
[tool.setuptools]
packages = ["fastfields.dlpack"]

[tool.setuptools.package-data]
"fastfields.dlpack" = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[project.urls]
Homepage = "https://github.com/fastfields/fastfields-dlpack"
Documentation = "https://fastfields.github.io/fastfields-dlpack/"
Issues = "https://github.com/fastfields/fastfields-dlpack/issues"
Repository = "https://github.com/fastfields/fastfields-dlpack"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

# The compute backend is stamped into the PEP 440 local version identifier
# (PyTorch convention: 0.0.0.dev1+cpu), driven by $FF_WHEEL_VARIANT at build
# time. Both steps are custom because versioningit skips `format` entirely when
# the checkout is exactly at a tag -- which is precisely the release case -- so
# the label has to be applied in `tag2version`, and `format` then exists only
# to fold the variant and the distance suffix into the single local segment
# PEP 440 allows. See _versioning.py for the full rationale.
[tool.versioningit.tag2version]
module = "_versioning"
value = "tag2version"

[tool.versioningit.format]
module = "_versioning"
value = "format"

[tool.versioningit.write]
file = "fastfields/dlpack/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastfields.dlpack"]
omit = ["*/_version.py"]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,docs/examples"
