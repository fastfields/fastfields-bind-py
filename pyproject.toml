[build-system]
requires = ["setuptools>=64", "wheel", "nanobind>=1.9", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields-dlpack"
version = "0.1.0"
description = "nanobind bindings from DLPack to the fastfields-lib C++ library (fastfields.dlpack)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fastfields" }]
dependencies = []

[project.optional-dependencies]
test = ["numpy", "pytest"]

# Explicit single-package listing: only the ``fastfields.dlpack`` subpackage is
# shipped. Crucially, no ``fastfields/__init__.py`` is created or packaged, so
# ``fastfields`` stays a PEP 420 native namespace package that other
# distributions (fastfields-numpy, fastfields-torch, fastfields-cupy,
# fastfields) can merge into.
[tool.setuptools]
packages = ["fastfields.dlpack"]

[tool.setuptools.package-data]
"fastfields.dlpack" = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]
